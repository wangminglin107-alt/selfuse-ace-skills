[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "research-skills-os"
version = "0.1.0"
description = "Contract-first runtime for independently callable and composable SSCI research skills."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "filelock>=3.18,<4",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
research-os = "research_skills_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_skills_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/research_skills_os"]

